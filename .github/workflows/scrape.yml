name: Daily Swertres Scraper

on:
  schedule:
    # Runs at 6:05 AM, 9:05 AM, and 1:05 PM UTC
    # This matches 2:05 PM, 5:05 PM, and 9:05 PM Philippine Standard Time (PHT)
    - cron: '5 6,9,13 * * *'
  workflow_dispatch: # Allows manual run inside GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      # FIX: Swapped to v4.2.2 which is built natively for Node 24
      uses: actions/checkout@v4.2.2

    - name: Set up Python
      # FIX: Swapped to v5.3.0 which removes Node 20 deprecation blocks completely
      uses: actions/setup-python@v5.3.0
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install requests beautifulsoup4

    - name: Run Scraper
      run: python scraper.py

    - name: Commit and Push Results
      run: |
        git config --global user.name "Github Action Bot"
        git config --global user.email "actions@github.com"
        git add results.json
        git commit -m "Update Swertres results [skip ci]" || exit 0
        git push
