name: Daily Swertres Scraper

on:
  schedule:
    # Runs at 6:05 AM, 9:05 AM, and 1:05 PM UTC
    # This matches 2:05 PM, 5:05 PM, and 9:05 PM Philippine Standard Time (PHT)
    - cron: '5 6,9,13 * * *'
  workflow_dispatch: # This adds a button so you can test run it manually

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install requests beautifulsoup4

    - name: Run Scraper
      run: python scraper.py

    - name: Commit and Push Results
      run: |
        git config --global user.name "Github Action Bot"
        git config --global user.email "actions@github.com"
        git add results.json
        git commit -m "Update Swertres results [skip ci]" || exit 0
        git push
